name: Fetch Tatoeba sentences

# Downloads the Tatoeba exports (tatoeba.org is blocked on some build machines),
# keeps the native-speaker Mandarin-English pairs and commits
# tools/sources/tatoeba_cmn_eng.tsv to the branch it ran on.
on:
  workflow_dispatch:
  push:
    branches: [tatoeba-sentences]
    paths: [tools/fetch_tatoeba.py, .github/workflows/fetch-tatoeba.yml]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Commits the updated sentence list back to the branch. No pull request
    # trigger, so this only runs for manual runs and pushes to that branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m unittest tools.tests.test_tatoeba -v
      - run: python -m tools.fetch_tatoeba
      - name: Commit the sentence list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/sources/tatoeba_cmn_eng.tsv
          git diff --cached --quiet || git commit -m "Update Tatoeba sentence pairs"
          git push
