name: Build iPad app

# Builds LanguageLibrary.ipa for installing with AltStore / AltServer.
# Mac time costs 10 of your free minutes per minute on a private repo, so this
# only runs when started from the Actions tab (Run workflow), or on a pull
# request that changes the iPad project.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/ios/**"
      - ".github/workflows/ios.yml"

# Read-only token by default. Only the publish job, which runs for manual
# runs from the Actions tab and never for pull requests, can write.
permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the newest Xcode on the runner
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - name: Build the app (not signed yet)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: Mark the app and widgets with their shared space
        # No certificate here: AltStore signs the app with your Apple ID when it
        # installs it. This placeholder signature only carries the entitlements
        # (the app group the widgets share), which AltStore reads to set them up.
        run: |
          APP=build/ios/iphoneos/Runner.app
          for f in "$APP"/Frameworks/*; do codesign --force --sign - "$f"; done
          codesign --force --sign - --entitlements ios/LanguageWidgets/LanguageWidgets.entitlements "$APP/PlugIns/LanguageWidgets.appex"
          codesign --force --sign - --entitlements ios/Runner/Runner.entitlements "$APP"
          echo "--- widget entitlements"; codesign -d --entitlements - "$APP/PlugIns/LanguageWidgets.appex"
          echo "--- app entitlements"; codesign -d --entitlements - "$APP"
      - name: Package LanguageLibrary.ipa
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry LanguageLibrary.ipa Payload
          ls -lh LanguageLibrary.ipa
      # Kept for a day: pull request builds are tested from it, and the publish
      # job below picks it up for manual runs.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: language-library-ipa
          path: app/LanguageLibrary.ipa
          retention-days: 1

  publish:
    needs: ipa
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: language-library-ipa
      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="ipad-${{ github.run_number }}"
          gh release create "$tag" LanguageLibrary.ipa \
            --title "iPad app (build ${{ github.run_number }})" \
            --notes "Install with AltServer: see 'Installing on your iPad' in the README." \
            --target "${{ github.sha }}"
