name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  data-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements-audio.txt
      - run: python -m unittest discover -s tools/tests -t . -v

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Android app (debug, installable on your phone)
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: language-library-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
