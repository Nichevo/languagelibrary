name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Each APK is over 100 MB, and the repo's free space for build files fills
  # up after a few days of changes, which stops new APKs (and iPad builds)
  # being saved. On main, delete every saved build file except the newest
  # APK before the new one is added. Space frees up within 6 to 12 hours.
  tidy-build-files:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Delete older build files
        run: |
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | "\(.created_at) \(.id) \(.name)"' | sort -r > all.txt
          newest_apk=$(grep ' language-library-apk$' all.txt | head -1 | cut -d' ' -f2)
          while read -r _ id name; do
            [ "$id" = "$newest_apk" ] && continue
            echo "Deleting $name ($id)"
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
          done < all.txt

  data-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements-audio.txt
      - run: python -m unittest discover -s tools/tests -t . -v

  app:
    needs: tidy-build-files
    # Still runs on pull requests, where the tidy-up is skipped.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Set up release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=release"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties
      - name: Build Android app
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Check how the app is signed
        run: |
          if [ -f android/key.properties ]; then echo "Signed with the release key"; else echo "::warning::No signing secrets set, so this APK uses a throwaway debug key. Updates will not install over it."; fi
      - uses: actions/upload-artifact@v4
        with:
          name: language-library-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
