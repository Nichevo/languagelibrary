name: language_library
description: "Mandarin word library with flashcards."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_timezone: ^5.1.1
  flutter_tts: ^4.2.5
  home_widget: ^0.10.0
  just_audio: ^0.10.6
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/audio/
    - assets/licenses/

# App icon: edit icon/icon.svg, re-render the PNGs, then run
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: icon/icon.png
  adaptive_icon_background: "#0D47A1"
  adaptive_icon_foreground: icon/foreground.png
